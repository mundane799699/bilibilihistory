server {
    listen 80;
    listen [::]:80;
    server_name bilibilihistory.mundane.ink;
    return 301 https://bilibilihistory.mundane.ink$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bilibilihistory.mundane.ink;

    # Use the server's existing, automatically renewed wildcard certificate.
    ssl_certificate /home/ssl/cert.pem;
    ssl_certificate_key /home/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;
    access_log /www/wwwlogs/bilibilihistory.mundane.ink.access.log;
    error_log /www/wwwlogs/bilibilihistory.mundane.ink.error.log;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
